name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    # Linux and Windows, on every supported Python version. Platform-only
    # tests skip themselves; the shared application behavior must pass on both.
    name: ${{ matrix.os }} · python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install the Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0 \
            libfontconfig1 libfreetype6 libgssapi-krb5-2

      - name: Install PyQt6
        run: python -m pip install --quiet PyQt6

      - name: Install the Windows sound support
        if: runner.os == 'Windows'
        run: python -m pip install --quiet PyAudioWPatch

      - name: Run the tests
        run: python -m unittest discover --verbose

  macos:
    # Native framework loading, paths, and shell installer parsing can only be
    # checked on a real macOS runner.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install PyQt6
        run: python -m pip install --quiet PyQt6

      - name: Run the tests
        run: python -m unittest discover --verbose

      - name: Check the installer parses
        run: |
          bash -n install.sh
          bash -n install-mac.sh
          bash -n update.sh
          bash -n uninstall.sh

  package:
    # Freeze the Windows application and run the packaged CLI so dynamically
    # selected platform adapters cannot go missing unnoticed.
    name: windows package
    runs-on: windows-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install what a build needs
        run: python -m pip install --quiet PyQt6 PyAudioWPatch pyinstaller

      - name: Build
        shell: pwsh
        run: >
          ./packaging/windows/build.ps1
          -Python python -SkipTests -SkipFfmpeg -SkipInstaller

      - uses: actions/upload-artifact@v4
        with:
          name: dikte-windows
          path: dist/Dikte
          retention-days: 7
